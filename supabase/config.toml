# Configuration Supabase LOCAL (supabase start). Voir https://supabase.com/docs/guides/local-development
project_id = "skj-academy"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]            # boîte mail de dev : http://127.0.0.1:54324 (emails de réinitialisation de mot de passe)
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080/reset-password", "http://localhost:4173/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false   # local : pas de confirmation d'email obligatoire (mettre true en production)
